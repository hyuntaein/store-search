<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVEBIC 점포 근접검색</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
body{margin:0;padding:20px;background:#f4f7fb;font-family:Arial,'Malgun Gothic',sans-serif;color:#10213f}
.wrap{max-width:1100px;margin:0 auto;background:white;border:1px solid #cfe0f8;border-radius:24px;padding:24px}
h1{margin:0 0 8px;color:#123f7a}
.sub{color:#64748b;margin-bottom:18px}
.card{border:1px solid #d7e6fb;background:#f8fbff;border-radius:18px;padding:18px;margin:16px 0}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font-size:14px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}
.blue{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.gray{background:#e5e7eb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:9px 12px;border-radius:999px;background:#eef6ff;border:1px solid #b8d3fb;font-weight:900;color:#123f7a}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{border-bottom:1px solid #e2e8f0;padding:10px;text-align:left}
th{background:#eaf4ff;color:#0b3b77}
.small{font-size:12px;color:#64748b}
</style>
</head>

<body>
<div class="wrap">
  <h1>RAVEBIC 점포 근접검색</h1>
  <div class="sub">세븐일레븐 / 이마트24 점포 리스트 업로드 → Firestore 저장 → 점포 검색 준비</div>
  <div class="badge" id="status">Firebase 연결 준비중...</div>

  <div class="card">
    <h2>1. 점포 엑셀 업로드</h2>
    <div class="sub">세븐일레븐 또는 이마트24 엑셀 파일을 업로드하세요.</div>

    <div class="row">
      <select id="brand">
        <option value="세븐일레븐">세븐일레븐</option>
        <option value="이마트24">이마트24</option>
      </select>
      <input id="fileInput" type="file" accept=".xlsx,.xls,.csv">
    </div>

    <div class="btns">
      <button class="blue" onclick="parseExcel()">엑셀 읽기</button>
      <button class="green" onclick="uploadStores()">Firestore 저장</button>
      <button class="gray" onclick="loadStores()">저장된 점포 불러오기</button>
    </div>

    <div class="small" id="uploadInfo">아직 읽은 파일이 없습니다.</div>
  </div>

  <div class="card">
    <h2>2. 점포명 검색</h2>
    <div class="row">
      <input id="searchInput" placeholder="예: 강남, 역삼, 여의도">
      <button class="blue" onclick="searchStores()">검색</button>
    </div>
    <div class="small">현재 단계에서는 점포명/주소 검색까지만 됩니다. 좌표 입력 후 가까운 점포 15개 기능을 붙입니다.</div>
  </div>

  <div class="card">
    <h2>점포 목록</h2>
    <div id="countInfo" class="small">0개</div>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>브랜드</th>
            <th>점포명</th>
            <th>주소</th>
            <th>위도</th>
            <th>경도</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6">데이터가 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyBmvE4sKxvO0OWTz2Nt70o-RuCKBTPds_0",
  authDomain:"ravebic-app.firebaseapp.com",
  projectId:"ravebic-app",
  storageBucket:"ravebic-app.firebasestorage.app",
  messagingSenderId:"44012584810",
  appId:"1:44012584810:web:540cd8aba9ca8bbf2baf13",
  measurementId:"G-EEN6GM72JT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let parsedStores = [];
let allStores = [];

document.getElementById("status").textContent = "Firebase 연결 완료";

function clean(v){
  return String(v == null ? "" : v).trim();
}

function normalizeKey(v){
  return clean(v).replace(/\s+/g,"").replace(/[·ㆍ.\-_/]/g,"");
}

function findColumn(headers, candidates){
  for(const c of candidates){
    const idx = headers.findIndex(h => normalizeKey(h).includes(normalizeKey(c)));
    if(idx >= 0) return idx;
  }
  return -1;
}

async function parseExcel(){
  const file = document.getElementById("fileInput").files[0];
  const brand = document.getElementById("brand").value;

  if(!file){
    alert("엑셀 파일을 선택하세요.");
    return;
  }

  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});

  if(rows.length < 2){
    alert("엑셀 데이터가 부족합니다.");
    return;
  }

  let headerRowIndex = 0;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const rowText = rows[i].join(" ");
    if(rowText.includes("점포") || rowText.includes("주소") || rowText.includes("상호")){
      headerRowIndex = i;
      break;
    }
  }

  const headers = rows[headerRowIndex].map(clean);

  const nameCol = findColumn(headers, ["점포명","점포","상호","매장명","점명"]);
  const addressCol = findColumn(headers, ["주소","소재지","점포주소","매장주소"]);
  const codeCol = findColumn(headers, ["점포코드","코드","점코드"]);

  if(nameCol < 0 || addressCol < 0){
    alert("점포명 또는 주소 컬럼을 찾지 못했습니다. 엑셀 헤더명을 확인해야 합니다.");
    console.log(headers);
    return;
  }

  parsedStores = rows.slice(headerRowIndex + 1)
    .map((r, idx) => ({
      brand,
      storeName: clean(r[nameCol]),
      address: clean(r[addressCol]),
      storeCode: codeCol >= 0 ? clean(r[codeCol]) : "",
      lat: null,
      lng: null,
      sourceFile: file.name,
      createdAtText: new Date().toISOString()
    }))
    .filter(r => r.storeName && r.address);

  document.getElementById("uploadInfo").textContent =
    file.name + " / " + parsedStores.length.toLocaleString() + "개 점포 읽음";

  renderStores(parsedStores.slice(0,100));
}

async function uploadStores(){
  if(!parsedStores.length){
    alert("먼저 엑셀 읽기를 하세요.");
    return;
  }

  if(!confirm(parsedStores.length.toLocaleString() + "개 점포를 Firestore stores 컬렉션에 저장할까요?")){
    return;
  }

  document.getElementById("status").textContent = "Firestore 저장 중...";

  const batchSize = 400;
  let saved = 0;

  for(let i=0;i<parsedStores.length;i+=batchSize){
    const batch = db.batch();
    const chunk = parsedStores.slice(i, i + batchSize);

    chunk.forEach(store => {
      const idBase = normalizeKey(store.brand + "_" + store.storeName + "_" + store.address).slice(0,120);
      const ref = db.collection("stores").doc(idBase);
      batch.set(ref, {
        ...store,
        searchKey: normalizeKey(store.brand + store.storeName + store.address),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    });

    await batch.commit();
    saved += chunk.length;
    document.getElementById("status").textContent =
      "Firestore 저장 중... " + saved.toLocaleString() + " / " + parsedStores.length.toLocaleString();
  }

  document.getElementById("status").textContent = "저장 완료 · " + saved.toLocaleString() + "개";
  alert("저장 완료");
}

async function loadStores(){
  document.getElementById("status").textContent = "점포 불러오는 중...";

  const snap = await db.collection("stores").limit(2000).get();
  allStores = [];
  snap.forEach(doc => allStores.push({id:doc.id, ...doc.data()}));

  document.getElementById("status").textContent =
    "저장된 점포 " + allStores.length.toLocaleString() + "개 불러옴";

  renderStores(allStores);
}

function searchStores(){
  const q = normalizeKey(document.getElementById("searchInput").value);

  if(!q){
    alert("검색어를 입력하세요.");
    return;
  }

  const base = allStores.length ? allStores : parsedStores;

  const results = base.filter(s =>
    normalizeKey((s.brand||"") + (s.storeName||"") + (s.address||"")).includes(q)
  ).slice(0,100);

  renderStores(results);
}

function renderStores(rows){
  const tbody = document.getElementById("tbody");
  document.getElementById("countInfo").textContent = rows.length.toLocaleString() + "개 표시";

  if(!rows.length){
    tbody.innerHTML = '<tr><td colspan="6">데이터가 없습니다.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${escapeHtml(r.brand)}</td>
      <td><b>${escapeHtml(r.storeName)}</b></td>
      <td>${escapeHtml(r.address)}</td>
      <td>${r.lat ?? ""}</td>
      <td>${r.lng ?? ""}</td>
    </tr>
  `).join("");
}

function escapeHtml(v){
  return String(v||"").replace(/[&<>'"]/g, s => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "'":"&#39;",
    '"':"&quot;"
  }[s]));
}
</script>
</body>
</html>
